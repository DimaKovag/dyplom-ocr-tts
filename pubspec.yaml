name: dyplom_kovhan
description: Local on-device OCR + TTS mobile application for diploma project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  flutter_tesseract_ocr:
    path: local_plugins/flutter_tesseract_ocr
  google_mlkit_text_recognition: ^0.15.1
  flutter_tts: ^4.2.5
  sqflite: ^2.4.3
  path: ^1.9.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/tessdata_config.json
    - assets/tessdata/
